apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  credit-service.json: |
    {
      "uid": "credit-service",
      "title": "Credit service",
      "tags": [
        "mlops",
        "credit"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "browser",
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Predict requests / s",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{handler=\"/v1/predict\"}[$__rate_interval]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true,
              "instant": false,
              "format": "time_series",
              "legendFormat": "requests/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 2,
          "title": "Predict latency: p50 / p95",
          "description": "HTTP latency includes inference and PostgreSQL audit. Histogram quantiles are estimates.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 7
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[$__rate_interval])))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true,
              "instant": false,
              "format": "time_series",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{handler=\"/v1/predict\"}[$__rate_interval])))",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true,
              "instant": false,
              "format": "time_series",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 3,
          "title": "Predicted bad risk share",
          "description": "Among predictions returned with HTTP 200; this is not the observed true class share.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum(rate(credit_model_predictions_total{risk=\"bad\"}[$__rate_interval])) / sum(rate(credit_model_predictions_total[$__rate_interval]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true,
              "instant": false,
              "format": "time_series",
              "legendFormat": "bad share"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        },
        {
          "id": 4,
          "title": "Score distribution: predictions / s",
          "description": "Disjoint score bins from cumulative Prometheus buckets; only HTTP 200 predictions.",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 8,
            "y": 7,
            "w": 16,
            "h": 7
          },
          "targets": [
            {
              "expr": "sum(rate(credit_model_score_bucket{le=\"0.2\"}[$__rate_interval]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "time_series",
              "legendFormat": "[0, 0.2]"
            },
            {
              "expr": "sum(rate(credit_model_score_bucket{le=\"0.4\"}[$__rate_interval])) - sum(rate(credit_model_score_bucket{le=\"0.2\"}[$__rate_interval]))",
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "time_series",
              "legendFormat": "(0.2, 0.4]"
            },
            {
              "expr": "sum(rate(credit_model_score_bucket{le=\"0.6\"}[$__rate_interval])) - sum(rate(credit_model_score_bucket{le=\"0.4\"}[$__rate_interval]))",
              "refId": "C",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "time_series",
              "legendFormat": "(0.4, 0.6]"
            },
            {
              "expr": "sum(rate(credit_model_score_bucket{le=\"0.8\"}[$__rate_interval])) - sum(rate(credit_model_score_bucket{le=\"0.6\"}[$__rate_interval]))",
              "refId": "D",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "time_series",
              "legendFormat": "(0.6, 0.8]"
            },
            {
              "expr": "sum(rate(credit_model_score_bucket{le=\"1.0\"}[$__rate_interval])) - sum(rate(credit_model_score_bucket{le=\"0.8\"}[$__rate_interval]))",
              "refId": "E",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "time_series",
              "legendFormat": "(0.8, 1]"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "displayMode": "gradient",
            "orientation": "horizontal",
            "reduceOptions": {
              "values": false,
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 5,
          "title": "Loaded model by pod",
          "description": "",
          "type": "table",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "credit_model_info",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": false,
              "instant": true,
              "format": "table"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "cellHeight": "sm"
          },
          "transformations": [
            {
              "id": "filterFieldsByName",
              "options": {
                "include": {
                  "names": [
                    "pod",
                    "model_version",
                    "Value"
                  ]
                }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "pod": "Pod",
                  "model_version": "Model version",
                  "Value": "Loaded"
                }
              }
            }
          ]
        },
        {
          "id": 6,
          "title": "Predict responses by HTTP status / s",
          "description": "",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(http_requests_total{handler=\"/v1/predict\"}[$__rate_interval]))",
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "range": true,
              "instant": false,
              "format": "time_series",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }
