services:
  api:
    image: credit-service:1.0
    build: .
    ports: ['8000:8000']
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/credit
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: credit
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d credit']
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
