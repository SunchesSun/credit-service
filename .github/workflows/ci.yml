name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_DB: credit}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/credit

    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  build:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions: {contents: read, packages: write}

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, kind]
    concurrency: {group: deploy-kind-mlpro3}
    timeout-minutes: 15

    permissions: {contents: read, packages: read}
    env:
      KIND_CLUSTER: mlpro3

    steps:
      - uses: actions/checkout@v7
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: kind, kubectl и доступ к кластеру
        run: |
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          echo "$bin" >> "$GITHUB_PATH"
          if [ ! -x "$bin/kind" ]; then
            curl --fail --silent --show-error --location \
              --output "$bin/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
            chmod +x "$bin/kind"
          fi
          if [ ! -x "$bin/kubectl" ]; then
            curl --fail --silent --show-error --location \
              --output "$bin/kubectl" https://dl.k8s.io/v1.37.0/bin/linux/amd64/kubectl
            chmod +x "$bin/kubectl"
          fi
          if [ "$(docker inspect --format '{{.State.Running}}' "$KIND_CLUSTER-control-plane")" != "true" ]; then
            docker start "$KIND_CLUSTER-control-plane"
          fi
          "$bin/kind" export kubeconfig --name "$KIND_CLUSTER" --internal
          for attempt in {1..60}; do
            if "$bin/kubectl" --request-timeout=5s get --raw=/readyz >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Kubernetes API did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          "$bin/kubectl" wait --for=condition=Ready node --all --timeout=120s

      - name: образ в кластер
        run: |
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name "$KIND_CLUSTER"

      - name: подтягиваем секреты
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          : "${DB_PASSWORD:?DB_PASSWORD secret is required}"
          kubectl create secret generic credit-secrets \
          --from-literal=POSTGRES_PASSWORD="$DB_PASSWORD" \
          --from-literal=DATABASE_URL="postgresql://postgres:$DB_PASSWORD@postgres:5432/credit" \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: база
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deploy/postgres --timeout=180s

      - name: сервис
        run: |
          kubectl apply -f k8s/
          kubectl set image deploy/credit-service api="$IMAGE"
          kubectl rollout status deploy/credit-service --timeout=120s

      - name: smoke
        run: |
          set -euo pipefail
          url="http://${KIND_CLUSTER}-control-plane:30080"
          host="Host: credit.localhost"

          health="$(curl --fail --silent --show-error --retry 5 --retry-all-errors -H "$host" "$url/health")"
          echo "$health"
          model_version="$(echo "$health" | python3 -c '
          import json, re, sys
          response = json.load(sys.stdin)
          assert response["model_path"] == "models:/german-credit@champion", response
          assert response["log_level"] == "INFO", response
          assert re.fullmatch(r"german-credit-v\d+", response["model_version"]), response
          print(response["model_version"])
          ')"

          prediction="$(curl --fail --silent --show-error -X POST -H "$host" \
            -H "Content-Type: application/json" -d @good.json "$url/v1/predict")"
          echo "$prediction"
          request_id="$(echo "$prediction" | python3 -c '
          import json, sys, uuid
          response = json.load(sys.stdin)
          assert 0 <= response["score"] <= 1, response
          assert response["is_bad_risk"] == (response["score"] >= 0.5), response
          assert response["model_version"] == sys.argv[1], response
          print(uuid.UUID(response["request_id"]))
          ' "$model_version")"

          kubectl exec deploy/postgres -- psql -U postgres -d credit \
            -Atc "SELECT count(*) FROM predictions WHERE request_id = '$request_id'::uuid AND model_version = '$model_version' AND status_code = 200" \
          | grep -qx 1

      - name: диагностика
        if: failure()

        run: |
          kubectl get pods -o wide
          kubectl get events --sort-by=.lastTimestamp
          kubectl describe pods -l app=credit
          kubectl describe deploy/credit-service | tail -20
          kubectl logs -l app=credit \
            --all-containers=true --tail=50 --prefix=true || true
          kubectl logs -l app=credit \
            --all-containers=true --previous --tail=50 --prefix=true || true
